services:
  postgres:
    image: postgres:16-alpine
    container_name: setu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: setu_portal
      POSTGRES_USER: setu
      POSTGRES_PASSWORD: setu_dev
    ports:
      - "54322:5432"
    volumes:
      - setu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U setu -d setu_portal"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  setu_postgres_data:
